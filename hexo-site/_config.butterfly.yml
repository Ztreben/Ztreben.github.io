# Butterfly theme config (basic)
# 官方文档: https://butterfly.js.org/

# 站点导航菜单
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

# 页脚版权
footer:
  since: 2025
  owner: Ztreben

# 文章设置
post_meta:
  date: true
  categories: true
  tags: true

# 代码高亮（使用主题内 prismjs/hljs 之一）
highlight_theme: mac  # 可选：default / mac / mac light / github
highlight_copy: true  # 代码复制按钮
highlight_lang: true  # 显示语言标签
highlight_shrink: false  # 代码块默认展开

# Fancybox 图片灯箱
fancybox: true

# 搜索（与 hexo-generator-searchdb 匹配）
local_search:
  enable: true
  preload: true

# 自定义样式注入（复用原 landscape 的 custom.css）
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'

# 社交 (示例，可后续补充)
social:
  fab fa-github: https://github.com/Ztreben || GitHub

# 侧边栏布局
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 记录学习，分享成长
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/Ztreben
  card_announcement:
    enable: true
    content: 欢迎来到我的技术博客！
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:

# RSS & Sitemap 已在主 _config.yml 中配置

# 网站图标
favicon: /images/favicon.png

# 头像配置
avatar:
  img: /images/avatar.jpg
  rounded: true
  effect: false

# 主题颜色（可后续优化）
colors:
  primary: '#2563eb'

# 页面加载动效
aos: true

# 深色模式
darkmode:
  enable: true
  button: true  # 显示切换按钮
  autoChangeMode: 1  # 1=跟随系统，2=固定深色，3=固定浅色

# 数学公式支持 (MathJax)
mathjax:
  enable: true
  per_page: true
